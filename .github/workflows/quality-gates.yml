name: Quality gates

on:
  push:
  pull_request:

concurrency:
  group: quality-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, i18n, onboarding & tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check onboarding progress
        run: npm run check:onboarding

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate i18n
        run: npm run check:i18n

      - name: Test
        run: npm run test
